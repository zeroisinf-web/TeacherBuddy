<style>
/* ══════════════════════════════════════════════════════════════════════
   TeacherBuddy — design tokens
   ══════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme: light;
  --paper:#FBFAF8;
  --surface:#FFFFFF;
  --surface-2:#F5F3EF;
  --surface-3:#EFECE6;
  --line:#E7E2D9;
  --line-strong:#D6CFC2;
  --ink:#1B1A18;
  --ink-2:#403D38;
  --muted:#726D64;
  --muted-2:#948E83;
  --accent:#0E6E5C;
  --accent-ink:#0A5647;
  --accent-soft:#E6F1EE;
  --accent-line:#B9D9D1;
  --amber:#A66A00;
  --amber-soft:#FBF2E1;
  --red:#A32E22;
  --red-soft:#FBEDEB;
  --blue:#20558A;
  --blue-soft:#EAF1F8;
  --violet:#5B4B8A;
  --violet-soft:#F0EDF8;
  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(27,26,24,.05);
  --shadow:0 2px 4px rgba(27,26,24,.04), 0 8px 24px -12px rgba(27,26,24,.14);
  --shadow-lg:0 4px 8px rgba(27,26,24,.05), 0 24px 60px -20px rgba(27,26,24,.24);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --maxw:1240px;
  --nav-w:248px;
  --header-h:60px;
}
*{box-sizing:border-box}
*::selection{background:var(--accent-soft);color:var(--accent-ink)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15.5px;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-wrap:break-word;
}
html[data-lang="hi"] body{line-height:1.72}
img,svg{max-width:100%;height:auto;display:block}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.018em;line-height:1.24}
p{margin:0 0 .85em}
p:last-child{margin-bottom:0}
hr{border:0;border-top:1px solid var(--line);margin:22px 0}
code,kbd{font-family:var(--mono);font-size:.86em}
kbd{background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:.76em;color:var(--muted)}

/* ═══ Header ═══ */
.hdr{
  position:sticky;top:0;z-index:60;height:var(--header-h);
  background:rgba(251,250,248,.86);backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
}
.hdr-in{max-width:var(--maxw);margin:0 auto;height:100%;padding:0 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0;color:var(--ink);text-decoration:none}
.brand:hover{text-decoration:none}
.brand-mark{width:29px;height:29px;border-radius:8px;background:linear-gradient(145deg,#128571,#0B5747);display:grid;place-items:center;flex-shrink:0;box-shadow:0 1px 3px rgba(14,110,92,.32)}
.brand-mark svg{width:17px;height:17px}
.brand-name{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
.brand-name b{font-weight:600;color:var(--accent)}
.hdr-sp{flex:1}
.searchbtn{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 11px;
  min-width:180px;max-width:340px;flex:1;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  color:var(--muted);cursor:pointer;transition:border-color .15s, box-shadow .15s;
  font-size:13.5px;text-align:start;
}
.searchbtn:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.searchbtn svg{width:15px;height:15px;flex-shrink:0;opacity:.65}
.searchbtn span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langtog{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;flex-shrink:0}
.langtog button{
  border:0;background:transparent;border-radius:7px;padding:4px 9px;font-size:12.5px;font-weight:560;
  color:var(--muted);cursor:pointer;transition:background .15s,color .15s;line-height:1.5;
}
.langtog button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.iconbtn{
  width:36px;height:36px;flex-shrink:0;display:grid;place-items:center;border-radius:9px;
  background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--ink-2);
  transition:border-color .15s,background .15s;position:relative;
}
.iconbtn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.iconbtn svg{width:17px;height:17px}
.iconbtn .badge{position:absolute;top:-5px;inset-inline-end:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--paper)}
.menubtn{display:none}

/* ═══ Layout ═══ */
.shell{max-width:var(--maxw);margin:0 auto;padding:0 18px;display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);gap:34px;align-items:start}
.nav{position:sticky;top:calc(var(--header-h) + 14px);padding:20px 0 40px;max-height:calc(100vh - var(--header-h) - 20px);overflow-y:auto;scrollbar-width:thin}
.nav-group+.nav-group{margin-top:18px}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);padding:0 10px;margin-bottom:6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;
  color:var(--ink-2);font-size:14px;font-weight:500;transition:background .13s,color .13s;
}
.nav a:hover{background:var(--surface-2);text-decoration:none;color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav a .ic{width:17px;height:17px;flex-shrink:0;opacity:.8}
.nav a.on .ic{opacity:1}
.main{padding:26px 0 90px;min-width:0}

/* ═══ Page bits ═══ */
.page-head{margin-bottom:24px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:9px}
.eyebrow::before{content:"";width:16px;height:1.5px;background:var(--accent);border-radius:2px}
h1.title{font-size:clamp(25px,3.6vw,34px);letter-spacing:-.028em;font-weight:660}
.lede{margin-top:10px;color:var(--muted);font-size:15.5px;max-width:66ch}
h2.sec{font-size:19px;font-weight:640;letter-spacing:-.02em;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
h2.sec:first-child{margin-top:0}
h2.sec .cnt{font-size:12px;font-weight:600;color:var(--muted-2);background:var(--surface-2);border:1px solid var(--line);padding:1px 7px;border-radius:20px}
h3.sub{font-size:15.5px;font-weight:640;margin:22px 0 10px}

/* ═══ Cards & grids ═══ */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;transition:border-color .16s,box-shadow .16s,transform .16s;position:relative;
}
.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
a.card{color:inherit;display:block}
a.card:hover{text-decoration:none;transform:translateY(-1px)}
.card-t{font-size:15px;font-weight:620;letter-spacing:-.012em;display:flex;align-items:flex-start;gap:7px}
.card-d{margin-top:5px;font-size:13.2px;color:var(--muted);line-height:1.55}
.card-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:11px;background:var(--accent-soft);color:var(--accent-ink)}
.card-ic svg{width:18px;height:18px}
.card-ic.b{background:var(--blue-soft);color:var(--blue)}
.card-ic.a{background:var(--amber-soft);color:var(--amber)}
.card-ic.r{background:var(--red-soft);color:var(--red)}
.card-ic.v{background:var(--violet-soft);color:var(--violet)}
.ext{width:13px;height:13px;flex-shrink:0;margin-top:3px;opacity:.4}
a.card:hover .ext{opacity:.8}

/* tile (home) */
.tile{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:15px 15px 14px;display:flex;flex-direction:column;gap:2px;color:inherit;
  transition:border-color .16s,box-shadow .16s,transform .16s;
}
.tile:hover{border-color:var(--accent-line);box-shadow:var(--shadow);transform:translateY(-2px);text-decoration:none}
.tile .card-ic{margin-bottom:12px}
.tile-t{font-size:14.6px;font-weight:620;letter-spacing:-.012em}
.tile-d{font-size:12.6px;color:var(--muted);line-height:1.5;margin-top:3px}

/* list rows */
.rows{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.row{
  display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);
  color:inherit;transition:background .13s;min-width:0;
}
.row:last-child{border-bottom:0}
a.row:hover{background:var(--surface-2);text-decoration:none}
.row-b{flex:1;min-width:0}
.row-t{font-size:14.3px;font-weight:560;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row-d{font-size:12.6px;color:var(--muted);margin-top:2px;line-height:1.5}
.row-n{font-family:var(--mono);font-size:11.5px;color:var(--muted-2);width:22px;flex-shrink:0;text-align:end}
.row-act{display:flex;gap:6px;flex-shrink:0;align-items:center}

/* ═══ Chips / pills / badges ═══ */
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:11.2px;font-weight:640;letter-spacing:.005em;white-space:nowrap;
  background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
}
.chip.ok{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent-line)}
.chip.new{background:var(--red-soft);color:var(--red);border-color:#F0CFCA}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:#EDDCB8}
.chip.gov{background:var(--blue-soft);color:var(--blue);border-color:#CBDCEE}
.chip.pdf{background:#FBEDEB;color:#9E2B1F;border-color:#F0CFCA}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}

/* ═══ Buttons ═══ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:13.8px;font-weight:580;
  cursor:pointer;transition:background .14s,border-color .14s,box-shadow .14s,transform .1s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(14,110,92,.28)}
.btn.pri:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.sm{height:31px;padding:0 10px;font-size:12.6px;border-radius:8px}
.btn.sm svg{width:13px;height:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--red);border-color:#F0CFCA;background:var(--red-soft)}
.btn.danger:hover{background:#F7DDD9}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}

/* ═══ Notice / callout ═══ */
.note{
  border:1px solid var(--line);border-inline-start:3px solid var(--accent);
  background:var(--surface);border-radius:var(--radius-sm);padding:13px 15px;font-size:13.8px;color:var(--ink-2);
}
.note.warn{border-inline-start-color:var(--amber);background:var(--amber-soft);border-color:#EDDCB8}
.note.info{border-inline-start-color:var(--blue);background:var(--blue-soft);border-color:#CBDCEE}
.note.red{border-inline-start-color:var(--red);background:var(--red-soft);border-color:#F0CFCA}
.note b{font-weight:660}
.note-t{font-weight:660;margin-bottom:3px;display:flex;align-items:center;gap:7px}

/* ═══ Tables ═══ */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.6px;min-width:440px}
th,td{padding:10px 13px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:640;font-size:12.2px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.8px}

/* ═══ Forms ═══ */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.4px;font-weight:620;color:var(--ink-2)}
.field .hint{font-size:11.8px;color:var(--muted-2)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:8px 11px;font-size:14px;transition:border-color .14s,box-shadow .14s;
}
input:hover,select:hover,textarea:hover{border-color:var(--line-strong)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:88px;font-family:var(--mono);font-size:12.8px;line-height:1.6}
.formgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.result-box{
  margin-top:14px;background:var(--accent-soft);border:1px solid var(--accent-line);
  border-radius:var(--radius-sm);padding:14px 16px;
}
.result-box .big{font-size:23px;font-weight:680;letter-spacing:-.02em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.result-box .lbl{font-size:12px;font-weight:640;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:2px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px dashed var(--accent-line);font-size:13.4px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;font-weight:640}

/* ═══ Search palette ═══ */
.ovl{position:fixed;inset:0;z-index:200;background:rgba(27,26,24,.34);backdrop-filter:blur(3px);display:none;padding:12vh 16px 16px}
.ovl.on{display:block;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pal{
  max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--line-strong);
  border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;animation:pop .18s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
.pal-in{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.pal-in svg{width:17px;height:17px;opacity:.5;flex-shrink:0}
.pal-in input{border:0;padding:0;font-size:16px;background:transparent}
.pal-in input:focus{box-shadow:none}
.pal-res{max-height:52vh;overflow-y:auto;padding:6px}
.pal-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;cursor:pointer;color:inherit;
}
.pal-item:hover,.pal-item.sel{background:var(--surface-2);text-decoration:none}
.pal-item.sel{background:var(--accent-soft)}
.pal-ic{width:28px;height:28px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
.pal-item.sel .pal-ic{background:var(--surface);color:var(--accent-ink)}
.pal-ic svg{width:14px;height:14px}
.pal-t{font-size:14px;font-weight:560;line-height:1.35}
.pal-s{font-size:11.8px;color:var(--muted-2);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-ft{padding:8px 14px;border-top:1px solid var(--line);background:var(--surface-2);font-size:11.5px;color:var(--muted-2);display:flex;gap:14px;flex-wrap:wrap}
.pal-gl{padding:11px 12px 4px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2)}
.empty{padding:34px 16px;text-align:center;color:var(--muted-2);font-size:13.5px}

/* ═══ Modal ═══ */
.modal{max-width:680px;margin:0 auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:80vh;animation:pop .18s cubic-bezier(.2,.9,.3,1)}
.modal.wide{max-width:900px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-h h3{flex:1;font-size:16px}
.modal-b{padding:16px;overflow-y:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ═══ Accordion ═══ */
details.acc{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:9px;overflow:hidden}
details.acc[open]{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
details.acc>summary{
  padding:13px 15px;cursor:pointer;font-weight:600;font-size:14.4px;list-style:none;
  display:flex;align-items:center;gap:10px;transition:background .13s;
}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:hover{background:var(--surface-2)}
details.acc>summary::after{content:"";width:8px;height:8px;border-inline-end:2px solid var(--muted-2);border-bottom:2px solid var(--muted-2);transform:rotate(45deg);margin-inline-start:auto;transition:transform .2s;flex-shrink:0}
details.acc[open]>summary::after{transform:rotate(-135deg)}
.acc-b{padding:0 15px 15px;border-top:1px solid var(--line);padding-top:14px}

/* ═══ Copy list (remarks) ═══ */
.cl{display:grid;gap:8px}
.cl-i{
  display:flex;align-items:flex-start;gap:11px;padding:11px 13px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;line-height:1.6;transition:border-color .14s,box-shadow .14s;
}
.cl-i:hover{border-color:var(--line-strong);box-shadow:var(--shadow-sm)}
.cl-i>span{flex:1;min-width:0}
.cl-i .btn{flex-shrink:0}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;padding:9px 17px;border-radius:24px;font-size:13.2px;font-weight:560;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow-lg);max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ═══ Timeline ═══ */
.tl{position:relative;padding-inline-start:24px}
.tl::before{content:"";position:absolute;inset-inline-start:6px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.tl-i{position:relative;padding-bottom:18px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;inset-inline-start:-24px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent-line)}
.tl-i.hot::before{border-color:var(--accent);background:var(--accent)}
.tl-d{font-size:11.8px;font-weight:700;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
.tl-t{font-size:14.6px;font-weight:600;margin-top:2px}
.tl-x{font-size:13.2px;color:var(--muted);margin-top:3px;line-height:1.55}

/* ═══ Stat strip ═══ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--surface);padding:13px 15px}
.stat-v{font-size:20px;font-weight:680;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-l{font-size:11.6px;color:var(--muted);margin-top:1px}

/* ═══ Hero ═══ */
.hero{
  background:linear-gradient(160deg,#FFFFFF 0%,#F6F4EF 100%);
  border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px 26px;margin-bottom:26px;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;inset-inline-end:-70px;top:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(14,110,92,.09),transparent 70%)}
.hero h1{font-size:clamp(24px,4vw,33px);letter-spacing:-.03em;font-weight:680;position:relative}
.hero p{margin-top:9px;color:var(--muted);font-size:15px;max-width:58ch;position:relative}
.hero .btnrow{margin-top:17px;position:relative}

/* ═══ Footer ═══ */
.ftr{border-top:1px solid var(--line);background:var(--surface)}
.ftr-in{max-width:var(--maxw);margin:0 auto;padding:30px 18px 22px;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.ftr h4{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-bottom:9px}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.ftr a{font-size:13.4px;color:var(--ink-2)}
.ftr-legal{max-width:var(--maxw);margin:0 auto;padding:0 18px 34px;font-size:12.2px;color:var(--muted-2);line-height:1.65;border-top:1px solid var(--line);padding-top:18px}
.ftr-legal strong{color:var(--muted)}

/* ═══ Misc ═══ */
.mono{font-family:var(--mono);font-size:12.6px}
.tabbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabbar::-webkit-scrollbar{display:none}
.tab{
  padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);
  font-size:13.2px;font-weight:560;cursor:pointer;white-space:nowrap;color:var(--muted);transition:all .14s;
}
.tab:hover{border-color:var(--line-strong);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.muted{color:var(--muted)}
.sm{font-size:13px}
.xs{font-size:11.8px}
.mt{margin-top:14px}
.mb{margin-bottom:14px}
.hide{display:none !important}
ul.bul{margin:0;padding-inline-start:19px;display:grid;gap:5px;font-size:14px;color:var(--ink-2)}
ul.bul li::marker{color:var(--accent)}
ol.num{margin:0;padding-inline-start:20px;display:grid;gap:7px;font-size:14px;color:var(--ink-2)}
ol.num li::marker{color:var(--accent);font-weight:700}
.steps{counter-reset:s;display:grid;gap:10px}
.step{display:flex;gap:12px;align-items:flex-start}
.step-n{counter-increment:s;width:25px;height:25px;flex-shrink:0;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:12.2px;font-weight:700;border:1px solid var(--accent-line)}
.step-n::before{content:counter(s)}
.step-b{font-size:14px;padding-top:2px;color:var(--ink-2)}
.step-b b{color:var(--ink);font-weight:620}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ═══ Sticky ad bar (होस्ट की गई वेबसाइट पर ही दिखती है) ═══ */
.adbar{
  position:fixed;inset-inline:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:saturate(1.5) blur(12px);backdrop-filter:saturate(1.5) blur(12px);
  border-top:1px solid var(--line);box-shadow:0 -2px 14px -8px rgba(27,26,24,.22);
  display:flex;flex-direction:column;align-items:center;
  transition:transform .26s cubic-bezier(.3,.8,.3,1);
}
.adbar.min{transform:translateY(calc(100% - 25px))}
.adbar-h{
  width:100%;max-width:var(--maxw);height:25px;display:flex;align-items:center;gap:9px;padding:0 14px;
  font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2);
}
.adbar-h .hint{font-weight:500;letter-spacing:.02em;text-transform:none;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adbar-h button{
  margin-inline-start:auto;border:0;background:transparent;cursor:pointer;color:var(--muted-2);
  display:grid;place-items:center;width:26px;height:22px;border-radius:6px;flex-shrink:0;
}
.adbar-h button:hover{background:var(--surface-2);color:var(--ink)}
.adbar-h svg{width:13px;height:13px;transition:transform .26s}
.adbar.min .adbar-h svg{transform:rotate(180deg)}
.adbar-b{width:100%;max-width:970px;padding:0 12px 9px;display:flex;justify-content:center;overflow:hidden}
.adbar-b ins{display:block;width:100%}
@media (max-width:520px){ .adbar-h .hint{display:none} }
@media print{ .adbar{display:none !important} }

/* ═══ Responsive ═══ */
@media (max-width:960px){
  :root{--header-h:56px}
  .shell{grid-template-columns:1fr;gap:0}
  .menubtn{display:grid}
  .nav{
    position:fixed;inset-block:var(--header-h) 0;inset-inline-start:0;width:270px;z-index:70;
    background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px 40px;
    transform:translateX(-102%);transition:transform .22s cubic-bezier(.3,.8,.3,1);max-height:none;box-shadow:var(--shadow-lg);
  }
  .nav.open{transform:none}
  .nav-scrim{position:fixed;inset:0;background:rgba(27,26,24,.3);z-index:65;display:none}
  .nav-scrim.on{display:block}
  .main{padding:20px 0 70px}
  .hero{padding:22px 18px}
  body{font-size:15px}
  .searchbtn{min-width:0;width:36px;flex:0 0 36px;padding:0;justify-content:center}
  .searchbtn span,.searchbtn kbd{display:none}
}
@media (max-width:520px){
  .hdr-in{padding:0 12px;gap:8px}
  .shell{padding:0 12px}
  .brand-name{font-size:17px}
  .g3,.g4{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
  .ovl{padding:7vh 10px 10px}
  .card,.tile{padding:14px}
}
@media print{
  .hdr,.nav,.ftr,.btnrow,.btn,.nav-scrim,.ovl,.tabbar{display:none !important}
  .shell{display:block;padding:0;max-width:none}
  .main{padding:0}
  body{background:#fff;font-size:11pt}
  .card,.rows,.tw,.note{break-inside:avoid;box-shadow:none}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:8pt;color:#555;word-break:break-all}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>
</head>

/* ─── 18. सामान्य प्रश्न / FAQ ──────────────────────────────────── */
faq: [
  { q:{hi:"क्या TeacherBuddy एक सरकारी वेबसाइट है?", en:"Is TeacherBuddy a government website?"},
    a:{hi:"नहीं। यह शिक्षकों की सुविधा हेतु बनाया गया एक निःशुल्क सहायक टूल है। यहाँ दिए गए सभी लिंक आधिकारिक सरकारी पोर्टल पर ही जाते हैं। किसी भी विवाद की स्थिति में सरकारी आदेश/पोर्टल ही मान्य होगा।", en:"No. It is a free helper tool for teachers. Every link here points to an official government portal. In case of any conflict, the government order/portal alone is authoritative."} },
  { q:{hi:"क्या यह ऑफ़लाइन काम करता है?", en:"Does it work offline?"},
    a:{hi:"हाँ। पूरी वेबसाइट एक ही HTML फ़ाइल में है — कोई बाहरी फ़ॉन्ट, स्क्रिप्ट या इमेज नहीं। फ़ाइल को कंप्यूटर या मोबाइल में सहेजकर बिना इंटरनेट के खोला जा सकता है। सभी टूल्स, टिप्पणियाँ, सारणियाँ व गणनाएँ ऑफ़लाइन चलती हैं। ऑफ़लाइन चलाने पर कोई विज्ञापन भी नहीं आता। केवल सरकारी पोर्टल के लिंक खोलने पर इंटरनेट चाहिए।", en:"Yes. The whole site is a single HTML file — no external fonts, scripts or images. Save it on a computer or phone and open it without internet. All tools, remarks, tables and calculations run offline, and no ads run in that mode either. Internet is needed only to open the government portal links."} },
  { q:{hi:"वेबसाइट पर विज्ञापन क्यों दिखते हैं?", en:"Why does the website show ads?"},
    a:{hi:"इस वेबसाइट पर Google AdSense के विज्ञापन दिखते हैं, जिनसे इसे निःशुल्क चलाने का खर्च निकलता है। विज्ञापन नीचे एक पतली पट्टी में रहते हैं और सामग्री को नहीं ढकते — पेज के नीचे उतनी जगह पहले से छोड़ी जाती है। यदि आप विज्ञापन बिल्कुल नहीं चाहते तो HTML फ़ाइल डाउनलोड करके ऑफ़लाइन चलाइए; उसमें कोई विज्ञापन या कुकी नहीं चलती।", en:"The website shows Google AdSense ads, which cover the cost of keeping it free. They sit in a slim bar at the bottom and never cover content — space is reserved for them in advance. If you want no ads at all, download the HTML file and run it offline; no ads or cookies run there."} },
  { q:{hi:"सरकार कोई तिथि या लिंक बदल दे तो क्या करें?", en:"What if the government changes a date or a link?"},
    a:{hi:"दो तरीके हैं — (1) फ़ाइल को Notepad में खोलकर सबसे ऊपर के “EDIT ZONE / संपादन क्षेत्र” में बदलाव करें, या (2) ऐप में ही “अद्यतन केंद्र” खोलकर बिना फ़ाइल छुए बदलाव करें, सहेजें और चाहें तो निर्यात कर लें।", en:"Two ways — (1) open the file in Notepad and edit the “EDIT ZONE” block at the top, or (2) open the built-in Update Center and change, save and export data without touching the file."} },
  { q:{hi:"क्या मेरा डेटा कहीं भेजा जाता है?", en:"Is my data sent anywhere?"},
    a:{hi:"हमारे पास नहीं। इस सेवा का अपना कोई सर्वर, लॉगिन या एनालिटिक्स नहीं है — आपकी भरी हुई सभी जानकारी केवल आपके ब्राउज़र के localStorage में रहती है और हम उसे देख नहीं सकते। वेबसाइट पर दिखने वाले Google विज्ञापनों हेतु Google स्वयं कुकीज़ का उपयोग करता है; इसका पूरा विवरण निजता नीति में दिया गया है।", en:"Not to us. This service has no server, login or analytics of its own — everything you enter stays in your browser's localStorage and we cannot see it. Google itself uses cookies for the ads shown on the website; the Privacy Policy explains this in full."} },
  { q:{hi:"कक्षा 5 और 8 का परिणाम कहाँ देखें?", en:"Where can I see the Class 5 and 8 results?"},
    a:{hi:"DIET द्वारा ग्रेड शाला दर्पण पोर्टल पर फीड किए जाने के बाद परिणाम सार्वजनिक होता है। रोल नंबर, जिला एवं कैप्चा भरकर परिणाम देखा जा सकता है।", en:"The result becomes public after DIETs feed the grades on the Shala Darpan portal. Enter roll number, district and captcha to view it."} },
  { q:{hi:"CCE में समेकित टिप्पणी कैसे लिखें?", en:"How should the consolidated CCE remark be written?"},
    a:{hi:"CCE / SIQE पेज पर “क्या न करें” के सात नियम एवं शिक्षक, अभिभावक व संस्था प्रधान की तैयार टिप्पणियाँ दी गई हैं — किसी भी टिप्पणी पर कॉपी बटन दबाकर सीधे उपयोग करें।", en:"The CCE / SIQE page lists the seven “what not to do” rules and ready-made teacher, guardian and principal remarks — press the copy button on any remark to use it directly."} }
],

function L(v){

  return v[LANG] != null ? v[LANG] : (v.hi || v.en || "");
}
function T(k){ return L(UI[k]||k); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function on(node,ev,fn){ node && node.addEventListener(ev,fn); }
function fmtDate(iso){
  if(!iso) return "";
  const p = String(iso).split("-");
  return p.length===3 ? p[2]+"."+p[1]+"."+p[0] : iso;
}
function parseDMY(s){
  const p=String(s||"").split(".");
  if(p.length!==3) return null;
  const d=new Date(+p[2], +p[1]-1, +p[0]);
  return isNaN(d) ? null : d;
}
let toastTimer;
function toast(msg){
  const t = el("#toast"); if(!t) return;
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("on"), 1900);
}
function copyText(txt){
  const done = ()=>toast(T("copied"));
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done));
  } else fallback(txt,done);
  function fallback(t,cb){
    const ta=document.createElement("textarea");
    ta.value=t; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); cb(); }catch(e){ toast("Copy failed"); }
    document.body.removeChild(ta);
  }
}

function download(filename, text, mime){
  const blob = new Blob([text], {type: mime||"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();

}

  (D.cce||{}).principalRemarks && D.cce.principalRemarks.forEach(r=>add(r, L({hi:"CCE टिप्पणी — संस्था प्रधान",en:"CCE remark — principal"}), "#/cce", "chart"));

function searchIndex(q){
  q = q.trim().toLowerCase();
  if(!q) return INDEX.slice(0,12);
  const terms = q.split(/\s+/);
  const scored = [];
  for(const it of INDEX){
    const hay = (it.t+" "+it.s).toLowerCase();
    let ok = true, score = 0;
    for(const tm of terms){
      const idx = hay.indexOf(tm);
      if(idx<0){ ok=false; break; }
      score += idx===0 ? 12 : (idx<20 ? 6 : 2);
    }
    if(ok){ if(it.t.toLowerCase().startsWith(q)) score+=25; scored.push({it:it,score:score}); }
  }
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,40).map(x=>x.it);
}

/* expose a few things to the page-render module */
window.__TB = {UI,I,svg,LS,L,T,esc,el,on,fmtDate,parseDMY,toast,copyText,download,printHTML,getProfile,setProfile,
  tagChip,saveBtn,linkRow,linkRows,pageHead,noteBox,copyList,steps,openModal,closeModal,
  get D(){return D;}, set D(v){D=v;}, get LANG(){return LANG;},
  buildIndex, refreshSaveIcons, isSaved, toggleSave,
  refreshFooter(){ renderFooter(); },
  refresh(){ renderFooter(); route(); }};

/* ─────────── Router ─────────── */
function currentRoute(){
  const h = location.hash || "#/home";
  const m = h.match(/^#\/([a-z0-9-]+)/i);
  return m ? m[1] : "home";
}
function route(){
  const id = currentRoute();
  const fn = window.PAGES && window.PAGES[id] ? window.PAGES[id] : window.PAGES.home;
  const main = el("#main");
  main.innerHTML = fn();
  renderNav();
  refreshSaveIcons();
  if(window.PAGE_HOOKS && window.PAGE_HOOKS[id]) window.PAGE_HOOKS[id]();
  window.scrollTo({top:0,behavior:"instant"in document.documentElement.style?"instant":"auto"});
  main.focus({preventScroll:true});
  el("#nav").classList.remove("open");
  el("#navScrim").classList.remove("on");
  document.title = "TeacherBuddy — " + (findNavTitle(id) || "शिक्षक साथी");
}
function findNavTitle(id){
  for(const g of NAV) for(const i of g.items) if(i.id===id) return L(i.t);
  return "";
}

/* ─────────── Language ─────────── */
function setLang(l){
  LANG = l; LS.set("lang",l);
  document.documentElement.setAttribute("data-lang",l);
  document.documentElement.setAttribute("lang",l);
  el("#langHi").setAttribute("aria-pressed", l==="hi");
  el("#langEn").setAttribute("aria-pressed", l==="en");
  el("#searchBtn").querySelector("span").textContent = T("searchPlaceholder");
  el("#palInput").setAttribute("placeholder", LANG==="hi" ? "खोजें… / Search…" : "Search… / खोजें…");
  buildIndex(); renderFooter(); route();
}

/* ─────────── Global events ─────────── */
function wire(){
  on(el("#langHi"),"click",()=>setLang("hi"));
  on(el("#langEn"),"click",()=>setLang("en"));
  on(el("#searchBtn"),"click",openPal);
  on(el("#palClose"),"click",closePal);
  on(el("#savedBtn"),"click",showSaved);
  on(el("#printBtn"),"click",()=>window.print());
  on(el("#menuBtn"),"click",()=>{
    const n = el("#nav"); const open = !n.classList.contains("open");
    n.classList.toggle("open",open); el("#navScrim").classList.toggle("on",open);
    el("#menuBtn").setAttribute("aria-expanded",open);
  });
  on(el("#navScrim"),"click",()=>{ el("#nav").classList.remove("open"); el("#navScrim").classList.remove("on"); });
  on(el("#modalX"),"click",closeModal);

  on(el("#palInput"),"input",e=>drawPal(e.target.value));
  on(el("#palInput"),"keydown",e=>{
    if(e.key==="ArrowDown"){ e.preventDefault(); movePal(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); movePal(-1); }
    else if(e.key==="Enter"){
      e.preventDefault();
      const node = el("#palRes").querySelectorAll(".pal-item")[palSel];
      if(node){ closePal(); node.click(); }
    }
  });
  on(el("#palOvl"),"click",e=>{ if(e.target.id==="palOvl") closePal(); });
  on(el("#modalOvl"),"click",e=>{ if(e.target.id==="modalOvl") closeModal(); });

  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); openPal(); }
    else if(e.key==="/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){ e.preventDefault(); openPal(); }
    else if(e.key==="Escape"){ closePal(); closeModal(); }
  });

  /* delegated clicks */
  document.addEventListener("click",e=>{
    const cp = e.target.closest("[data-copy]");
    if(cp){ copyText(cp.getAttribute("data-copy")); return; }
    const sv = e.target.closest("[data-savefor]");
    if(sv){ e.preventDefault(); toggleSave(sv.getAttribute("data-savefor"), sv.getAttribute("data-savetitle")); return; }
    const us = e.target.closest("[data-unsave]");
    if(us){ SAVED.splice(+us.getAttribute("data-unsave"),1); LS.set("saved",SAVED); paintSavedCount(); showSaved(); refreshSaveIcons(); return; }
    if(e.target.closest("[data-modalclose]")){ closeModal(); return; }
  });

  window.addEventListener("hashchange",route);
}

/* ─────────── Advertising ───────────
   विज्ञापन केवल तभी लोड होते हैं जब पेज http/https पर खुला हो और असली
   पब्लिशर आईडी भरा हो। file:// से खोली गई ऑफ़लाइन फ़ाइल में कभी नहीं।
   Ads load only over http/https with a real publisher ID — never in the
   offline file opened from file://.                                        */
function initAds(){
  const cfg = D.ads || {};
  const onWeb = location.protocol === "http:" || location.protocol === "https:";
  const placeholder = !cfg.client || /X{4,}/i.test(cfg.client) || cfg.client.indexOf("ca-pub-") !== 0;
  if(!cfg.enabled || !onWeb || placeholder) return;

  const reserve = Math.max(0, +cfg.reserve || 0);
  const clear = () => {
    document.body.style.paddingBottom = "";
    const b = el(".adbar"); if(b) b.remove();
  };

  const s = document.createElement("script");
  s.async = true;
  s.crossOrigin = "anonymous";
  s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(cfg.client);
  s.onerror = clear;                       /* ब्लॉक या ऑफ़लाइन होने पर जगह छोड़ दें */
  document.head.appendChild(s);

  if(cfg.mode === "manual" && cfg.slot && !/X{4,}/i.test(cfg.slot)){
    const bar = document.createElement("div");
    bar.className = "adbar";
    bar.innerHTML =
      '<div class="adbar-h"><span>'+esc(L(cfg.label||{hi:"विज्ञापन",en:"Advertisement"}))+'</span>'+
      '<span class="hint">'+esc(L(cfg.hint||""))+'</span>'+
      '<button type="button" aria-label="'+esc(L({hi:"विज्ञापन पट्टी छोटी करें",en:"Minimise ad bar"}))+'">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button></div>'+
      '<div class="adbar-b"><ins class="adsbygoogle" style="display:block" '+
        'data-ad-client="'+esc(cfg.client)+'" data-ad-slot="'+esc(cfg.slot)+'" '+
        'data-ad-format="horizontal" data-full-width-responsive="true"></ins></div>';
    document.body.appendChild(bar);
    bar.querySelector("button").addEventListener("click", function(){
      const min = bar.classList.toggle("min");
      document.body.style.paddingBottom = min ? "28px" : reserve + "px";
      this.setAttribute("aria-label", L(min ? {hi:"विज्ञापन पट्टी खोलें",en:"Expand ad bar"}
                                           : {hi:"विज्ञापन पट्टी छोटी करें",en:"Minimise ad bar"}));
    });
    try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(e){}
    /* विज्ञापन न भरे जाने पर खाली पट्टी न दिखे */
    setTimeout(function(){
      const ins = bar.querySelector("ins.adsbygoogle");
      if(!ins || ins.getAttribute("data-ad-status") === "unfilled" || ins.offsetHeight < 8) clear();
    }, 4000);
  }
  document.body.style.paddingBottom = reserve + "px";
}

/* ─────────── Installable web app (केवल होस्ट की गई साइट पर) ─────────── */
function initPWA(){
  const secure = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if(!secure) return;                        /* file:// पर कुछ न करें */
  const m = document.createElement("link");
  m.rel = "manifest"; m.href = "manifest.json";
  document.head.appendChild(m);
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
}

  buildIndex(); wire(); paintSavedCount(); renderFooter(); route(); initAds(); initPWA();
};
})();

function campaigns(){
  const cs = D().campaigns||[];
  const blocks = cs.map((c,idx)=>{
    let body = '<p class="sm">'+esc(L(c.d||""))+'</p>';
    if(c.theme||c.period||c.target){
      body += '<div class="grid g2 mt">'+
        (c.theme?'<div class="card"><div class="card-d">'+esc(L({hi:"थीम",en:"Theme"}))+'</div><div class="card-t">'+esc(L(c.theme))+'</div></div>':'')+
        (c.period?'<div class="card"><div class="card-d">'+esc(L({hi:"अवधि",en:"Period"}))+'</div><div class="card-t">'+esc(L(c.period))+'</div></div>':'')+
        (c.target?'<div class="card"><div class="card-d">'+esc(L({hi:"लक्ष्य",en:"Target"}))+'</div><div class="card-t">'+esc(L(c.target))+'</div></div>':'')+
      '</div>';
    }
    if(c.facts) body += '<div class="card mt">'+c.facts.map(f=>'<div class="kv"><span>'+esc(L(f.l))+'</span><b>'+esc(L(f.v))+'</b></div>').join("")+'</div>';
    if(c.timeline) body += '<h3 class="sub">'+esc(L({hi:"समय-सारणी",en:"Timeline"}))+'</h3><div class="card"><div class="tl">'+
      c.timeline.map(t=>'<div class="tl-i hot"><div class="tl-d">'+esc(t.d)+'</div><div class="tl-t">'+esc(L(t.t))+'</div><div class="tl-x">'+esc(L(t.x))+'</div></div>').join("")+'</div></div>';
    if(c.steps) body += '<h3 class="sub">'+esc(L({hi:"प्रक्रिया",en:"Process"}))+'</h3><div class="card">'+steps(c.steps)+'</div>';
    if(c.blocks) body += c.blocks.map(b=>
      '<details class="acc"><summary>'+esc(L(b.h))+'</summary><div class="acc-b"><ul class="bul">'+
      b.items.map(i=>'<li>'+esc(L(i))+'</li>').join("")+'</ul></div></details>').join("");
    if(c.links) body += '<h3 class="sub">'+esc(L({hi:"संबंधित लिंक",en:"Related links"}))+'</h3>'+linkRows(c.links);
    return '<details class="acc"'+(idx===0?' open':'')+'><summary>'+svg("flag")+esc(L(c.t))+'</summary><div class="acc-b">'+body+'</div></details>';
  }).join("");

  return pageHead(L({hi:"राज्य अभियान",en:"State campaigns"}),
      L({hi:"अभियान एवं गतिविधियाँ",en:"Campaigns & Activities"}),

    blocks;
}

/* ───────────────────── hooks ───────────────────── */
const HOOKS = {
  admission(){
    const inp = el("#admDob"), out = el("#admOut");
    if(!inp) return;
    const ages = (D().admission||{}).ages||[];
    inp.addEventListener("input",()=>{
      const v = inp.value; if(!v){ out.innerHTML=""; return; }
      const d = new Date(v+"T00:00:00");
      const hit = ages.filter(a=>{
        const f=new Date(a.from+"T00:00:00"), t=new Date(a.to+"T00:00:00");
        return d>=f && d<=t;
      });
      if(hit.length){
        out.innerHTML = '<div class="result-box"><div class="lbl">'+esc(L({hi:"पात्र कक्षा",en:"Eligible class"}))+'</div>'+
          '<div class="big">'+hit.map(h=>L({hi:"कक्षा ",en:"Class "})+h.cls).join(" / ")+'</div>'+
          '<div class="sm mt">'+esc(L({hi:"आयु वर्ग",en:"Age group"}))+': '+esc(hit[0].age)+'</div></div>';
      } else {
        const younger = ages[0] && d > new Date(ages[0].to+"T00:00:00");
        out.innerHTML = '<div class="result-box" style="background:var(--amber-soft);border-color:#EDDCB8">'+
          '<div class="lbl" style="color:var(--amber)">'+esc(L({hi:"सारणी से बाहर",en:"Outside the chart"}))+'</div>'+
          '<div class="sm">'+esc(L(younger
            ? {hi:"यह जन्म-तिथि कक्षा 1 की सीमा से भी नई है — बच्चा अभी प्रवेश आयु से छोटा है।",en:"This date of birth is later than the Class 1 window — the child is younger than the admission age."}
            : {hi:"यह जन्म-तिथि कक्षा 8 की सीमा से पुरानी है। संबंधित कक्षा हेतु विभागीय आयु शिथिलता आदेश देखें।",en:"This date of birth is earlier than the Class 8 window. Refer to the departmental age-relaxation order for the relevant class."}))+'</div></div>';
      }
    });
  },
  cce(){
    const c = D().cce||{};
    const map = {t:c.teacherRemarks||[], g:c.guardianRemarks||[], p:c.principalRemarks||[]};
    let cur = "t";
    const list = el("#cceList"), filt = el("#cceFilter");
    function paint(){
      const q=(filt.value||"").trim().toLowerCase();
      const arr = map[cur].filter(x=>!q || x.toLowerCase().indexOf(q)>=0);
      list.innerHTML = arr.length ? copyList(arr) : '<div class="empty">'+esc(T("noResults"))+'</div>';
    }
    document.querySelectorAll("[data-cce]").forEach(b=>b.addEventListener("click",()=>{
      document.querySelectorAll("[data-cce]").forEach(x=>x.setAttribute("aria-selected","false"));
      b.setAttribute("aria-selected","true"); cur=b.getAttribute("data-cce"); paint();
    }));
    filt && filt.addEventListener("input",paint);
  },
  mdm(){
    const m = D().mdm||{};
    const cooks=el("#mdmCooks"), mon=el("#mdmMonth"), rate=el("#mdmRate"), out=el("#mdmOut");
    if(!cooks) return;
    function sync(){ const h=(m.honorarium||[])[+mon.value]; if(h) rate.value=h.amt; calc(); }
    function calc(){
      const n=+cooks.value||0, r=+rate.value||0, tot=n*r;
      const h=(m.honorarium||[])[+mon.value]||{};
      out.innerHTML='<div class="result-box"><div class="lbl">'+esc(L({hi:"कुल देय मानदेय",en:"Total honorarium payable"}))+'</div>'+
        '<div class="big">₹ '+tot.toLocaleString("en-IN")+'</div>'+
        '<div class="mt"><div class="kv"><span>'+esc(T("month"))+'</span><b>'+esc(L(h.m||""))+'</b></div>'+
        '<div class="kv"><span>'+esc(L({hi:"प्रति कुक-कम-हेल्पर दर",en:"Rate per cook-cum-helper"}))+'</span><b>₹ '+r.toLocaleString("en-IN")+'</b></div>'+
        '<div class="kv"><span>'+esc(L({hi:"संख्या",en:"Count"}))+'</span><b>'+n+'</b></div>'+
        (h.note&&L(h.note)?'<div class="kv"><span>'+esc(T("note"))+'</span><b>'+esc(L(h.note))+'</b></div>':'')+'</div></div>';
    }
    mon.addEventListener("change",sync);
    cooks.addEventListener("input",calc); rate.addEventListener("input",calc);
    sync();

    /* foodgrain, cooking cost and Bal Gopal milk */
    const nm = (D().rates||{}).mdmNorms;
    if(el("#mdmPri") && nm){
      const ids=["mdmPri","mdmUpr","mdmDays","mdmMilkDays"];
      const grain=()=>{
        const p=+el("#mdmPri").value||0, u=+el("#mdmUpr").value||0;
        const dz=+el("#mdmDays").value||0, md=+el("#mdmMilkDays").value||0;
        const gP=p*nm.grainPrimary*dz/1000, gU=u*nm.grainUpper*dz/1000;
        const cP=p*nm.cookPrimary*dz, cU=u*nm.cookUpper*dz;
        const mP=p*nm.milkPrimary*md/1000, mU=u*nm.milkUpper*md/1000;
        const fmt=n=>n.toLocaleString("en-IN",{maximumFractionDigits:2});
        el("#mdmGrainOut").innerHTML='<div class="result-box"><div class="lbl">'+esc(L({hi:"माह की कुल आवश्यकता",en:"Total requirement for the month"}))+'</div>'+
          '<div class="big">'+fmt(gP+gU)+' '+esc(L({hi:"कि.ग्रा. खाद्यान्न",en:"kg foodgrain"}))+'</div>'+
          '<div class="mt">'+
          '<div class="kv"><span>'+esc(L({hi:"खाद्यान्न — प्राथमिक",en:"Foodgrain — primary"}))+' ('+nm.grainPrimary+' g)</span><b>'+fmt(gP)+' kg</b></div>'+
          '<div class="kv"><span>'+esc(L({hi:"खाद्यान्न — उच्च प्राथमिक",en:"Foodgrain — upper primary"}))+' ('+nm.grainUpper+' g)</span><b>'+fmt(gU)+' kg</b></div>'+
          '<div class="kv"><span>'+esc(L({hi:"कुकिंग कन्वर्जन लागत — प्राथमिक",en:"Cooking cost — primary"}))+' (₹'+nm.cookPrimary+')</span><b>₹ '+fmt(cP)+'</b></div>'+
          '<div class="kv"><span>'+esc(L({hi:"कुकिंग कन्वर्जन लागत — उच्च प्राथमिक",en:"Cooking cost — upper primary"}))+' (₹'+nm.cookUpper+')</span><b>₹ '+fmt(cU)+'</b></div>'+
          '<div class="kv"><span>'+esc(L({hi:"कुल कुकिंग लागत",en:"Total cooking cost"}))+'</span><b>₹ '+fmt(cP+cU)+'</b></div>'+
          '<div class="kv"><span>'+esc(L({hi:"दुग्ध पाउडर — बाल गोपाल योजना",en:"Milk powder — Bal Gopal Yojana"}))+'</span><b>'+fmt(mP+mU)+' kg</b></div>'+
          '</div></div>';
      };
      ids.forEach(i=>el("#"+i).addEventListener("input",grain));
      grain();
    }
  },
  training(){
    const f = el("#trFilter"); if(!f) return;
    f.addEventListener("input",()=>{
      const q=f.value.trim().toLowerCase();
      document.querySelectorAll("#trTable tbody tr").forEach(tr=>{
        tr.style.display = !q || tr.textContent.toLowerCase().indexOf(q)>=0 ? "" : "none";
      });
    });
  },
  leave(){
    const j=el("#clJoin"), t=el("#clTill"), y=el("#clYear"), out=el("#clOut");
    if(!j) return;
    function calc(){
      if(!j.value||!t.value){ out.innerHTML=""; return; }
      const a=new Date(j.value+"T00:00:00"), b=new Date(t.value+"T00:00:00");
      if(b<a){ out.innerHTML='<div class="note red mt">'+esc(L({hi:"अंतिम तिथि कार्यग्रहण तिथि से पहले नहीं हो सकती।",en:"The end date cannot be before the joining date."}))+'</div>'; return; }
      const days = Math.round((b-a)/86400000)+1;
      const months = Math.max(0, (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + (b.getDate()>=a.getDate()?0:-1));
      const annual = +y.value||15;
      const exact = annual*days/365;
      out.innerHTML='<div class="result-box"><div class="lbl">'+esc(L({hi:"आनुपातिक CL",en:"Proportionate CL"}))+'</div>'+
        '<div class="big">'+Math.floor(exact)+' <span style="font-size:15px;font-weight:500">'+esc(L({hi:"दिन",en:"days"}))+'</span></div>'+
        '<div class="mt"><div class="kv"><span>'+esc(L({hi:"सेवा अवधि",en:"Service period"}))+'</span><b>'+days+' '+esc(L({hi:"दिन",en:"days"}))+' ≈ '+months+' '+esc(L({hi:"माह",en:"months"}))+'</b></div>'+
        '<div class="kv"><span>'+esc(L({hi:"सटीक गणना",en:"Exact value"}))+'</span><b>'+exact.toFixed(2)+'</b></div>'+
        '<div class="kv"><span>'+esc(L({hi:"मासिक आधार पर",en:"On monthly basis"}))+'</span><b>'+Math.floor(annual*months/12)+'</b></div></div></div>';
    }
    [j,t,y].forEach(x=>x.addEventListener("input",calc));
  }
};

window.PAGES = Object.assign(window.PAGES||{}, {
  home, admission, papers, results, cce, mdm, books, training, formats, portals,
  campaigns, leave, ifms, predeled, about, privacy
});
window.PAGE_HOOKS = Object.assign(window.PAGE_HOOKS||{}, HOOKS);
})();
</script>

(function(){
"use strict";
const A = window.__TB;
const {svg,L,T,esc,el,linkRows,pageHead,noteBox,steps,toast,copyText} = A;

const KIND = {
  academic:  {c:"ok",   hi:"शैक्षिक",   en:"Academic"},

  const m = KIND[k]; if(!m) return "";
  return '<span class="chip '+m.c+'">'+esc(L({hi:m.hi,en:m.en}))+'</span>';

  const s = D().shivira||{}, nb = D().noBagDay||{};

function fieldHTML(fid,x){
  const id = "f_"+fid+"_"+x.id;
  const req = x.req ? ' required' : '';
  let inp;
  if(x.type==="select"){
    inp = '<select id="'+id+'" data-fid="'+esc(x.id)+'">'+(x.options||[]).map(o=>'<option>'+esc(o)+'</option>').join("")+'</select>';
  } else if(x.type==="textarea"){
    inp = '<textarea id="'+id+'" data-fid="'+esc(x.id)+'" style="font-family:inherit;font-size:14px;min-height:84px">'+esc(x.def||"")+'</textarea>';
  } else {
    inp = '<input type="'+(x.type||"text")+'" id="'+id+'" data-fid="'+esc(x.id)+'" value="'+esc(x.def||"")+'"'+req+'>';
  }
  const wide = x.type==="textarea" ? ' style="grid-column:1/-1"' : '';
  return '<div class="field"'+wide+'><label for="'+id+'">'+esc(L(x.l))+(x.req?' *':'')+'</label>'+inp+'</div>';
}

const PROFILE_KEYS = ["name","desig","school","empid","office","head","place"];

function collect(fid){
  const f = (D().letterFormats||[]).find(x=>x.id===fid) || {};
  const v = {};
  (f.fields||[]).forEach(x=>{
    const n = g("f_"+fid+"_"+x.id);
    let val = n ? n.value : "";
    if(x.type==="date" && val) val = A.fmtDate(val);
    v[x.id] = val;
  });
  return {f:f, v:v};
}
function fill(tpl, v){
  return String(tpl||"").replace(/\{\{(\w+)\}\}/g, (m,k)=> (v[k]!=null && v[k]!=="") ? v[k] : "____________");
}
function letterHTML(fid){
  const {f,v} = collect(fid);
  const lang = document.documentElement.getAttribute("data-lang")||"hi";
  const pick = o => o ? (o[lang]!=null ? o[lang] : (o.hi||o.en||"")) : "";
  const nl = s => esc(s).replace(/\n/g,"<br>");

  let inner = '<div class="b">';
  inner += '<div class="pre" style="font-size:13px;margin-bottom:10px">'+nl(fill(pick(f.to),v))+'</div>';
  inner += '<hr>';
  inner += '<p class="c"><b>'+esc(L({hi:"विषय",en:"Subject"}))+': '+esc(fill(pick(f.sub),v))+'</b></p>';
  if(v.ref) inner += '<p><b>'+esc(L({hi:"संदर्भ",en:"Reference"}))+':</b> '+esc(v.ref)+'</p>';
  const bodyTxt = fill(pick(f.body),v);
  if(bodyTxt.trim()) inner += '<div class="pre">'+nl(bodyTxt)+'</div>';

  if(f.table){
    const cols = f.table.cols[lang] || f.table.cols.hi;
    inner += '<table><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join("")+'</tr>';
    for(let i=1;i<=(f.table.rows||31);i++){
      inner += '<tr><td>'+i+'</td>'+cols.slice(1).map(()=>'<td>&nbsp;</td>').join("")+'</tr>';
    }
    inner += '</table>';
  }
  if(f.copiesField && v[f.copiesField]){
    const list = String(v[f.copiesField]).split(/\r?\n/).filter(Boolean);
    if(list.length) inner += '<hr><p><b>'+esc(L({hi:"प्रतिलिपि",en:"Copy to"}))+':</b></p><ol>'+list.map(c=>'<li>'+esc(c)+'</li>').join("")+'</ol>';
  }
  const sg = f.sign && (f.sign[lang]||f.sign.hi) || [];
  inner += '<div class="sig"><div>'+
    (v.place||v.date ? esc(L({hi:"स्थान",en:"Place"}))+": "+esc(v.place||"____")+"\n"+esc(L({hi:"दिनांक",en:"Date"}))+": "+esc(v.date||"____") : "")+
    '</div><div>'+sg.map(x=>esc(fill(x,v))).join("\n")+'</div></div>';
  if(f.extra) inner += '<hr><p class="sm">'+esc(fill(pick(f.extra),v))+'</p>';
  inner += '</div>';
  return {title: pick(f.n), html: inner};
}

function taxOn(income, regime){
  let last = 0, tax = 0;
  for(const s of (regime.slabs||[])){
    if(income > last){
      const part = Math.min(income, s.upto) - last;
      tax += part * s.rate / 100;
      last = s.upto;
    } else break;
  }
  return tax;
}

function ordRows(list){

  }).join("")+'</div>';
}

  salary(){
    const r = D().rates||{}, pm = D().payMatrix||[];
    if(!g("sLevel")) return;
    const lv = g("sLevel"), bs = g("sBasic");
    lv.value = "L-10";
    function stages(){
      const p = pm.find(x=>x.id===lv.value) || pm[0];
      bs.innerHTML = (p.s||[]).map((v,i)=>'<option value="'+v+'">'+L({hi:"अवस्था ",en:"Stage "})+(i+1)+" — ₹"+v.toLocaleString("en-IN")+'</option>').join("");
      calc();
    }
    function slab(list, basic, key){
      const s = (list||[]).find(x=>basic<=x.upto);
      return s ? (s[key]||0) : 0;
    }
    function calc(){
      const basic = +bs.value||0;
      const daR = parseFloat(g("sDa").value); const da = Math.round(basic*(isNaN(daR)?0:daR)/100);
      const city = g("sHra").value; const hraR = (r.hra||{})[city]||0; const hra = Math.round(basic*hraR/100);
      const gross = basic+da+hra;
      const si = slab(r.siSlabs, basic, "premium");
      const rghs = slab(r.rghsSlabs, basic, "amount");
      const isNps = g("sPen").value==="nps";
      const pen = isNps ? Math.round((basic+da)*(r.npsEmployeePercent||10)/100) : Math.round(basic*(r.gpfMinPercent||6)/100);
      const tds = +g("sTds").value||0;
      const ded = si+rghs+pen+tds;
      const net = gross-ded;
      window.__TB_PAY = {basic,daR,da,city,hraR,hra,gross,si,rghs,pen,isNps,tds,ded,net,level:lv.options[lv.selectedIndex].text};
      g("sOut").innerHTML = '<div class="result-box"><div class="lbl">'+esc(L({hi:"शुद्ध देय वेतन",en:"Net in-hand salary"}))+'</div>'+
        '<div class="big">'+rupee(net)+'</div><div class="mt">'+kv([
          [L({hi:"मूल वेतन",en:"Basic pay"}), rupee(basic)],
          [L({hi:"महंगाई भत्ता",en:"Dearness allowance"})+" ("+(isNaN(daR)?0:daR)+"%)", rupee(da)],
          [L({hi:"मकान किराया भत्ता",en:"House rent allowance"})+" ("+hraR+"%)", rupee(hra)],
          [L({hi:"सकल वेतन",en:"Gross salary"}), "<b>"+rupee(gross)+"</b>"],
          [L({hi:"राज्य बीमा (SI)",en:"State Insurance (SI)"}), "− "+rupee(si)],
          [L({hi:"RGHS अंशदान",en:"RGHS contribution"}), "− "+rupee(rghs)],
          [(isNps?"NPS":"GPF"), "− "+rupee(pen)],
          [L({hi:"आयकर",en:"Income tax"}), "− "+rupee(tds)],
          [L({hi:"कुल कटौती",en:"Total deductions"}), "− <b>"+rupee(ded)+"</b>"]
        ])+'</div></div>';
    }
    lv.addEventListener("change",stages);
    ["sBasic","sDa","sHra","sPen","sTds"].forEach(id=>{ g(id).addEventListener("input",calc); g(id).addEventListener("change",calc); });
    stages();

    g("sPrint").addEventListener("click",()=>{
      const p = window.__TB_PAY; if(!p) return;
      const prof = A.getProfile();
      A.printHTML(L({hi:"वेतन विवरण",en:"Pay slip"}),
        '<div class="b"><div class="c"><h2>'+esc(prof.school||L({hi:"विद्यालय का नाम",en:"School name"}))+'</h2>'+
        '<h3>'+esc(L({hi:"अनुमानित मासिक वेतन विवरण",en:"Indicative monthly pay statement"}))+'</h3></div><hr>'+
        '<div class="hd"><div>'+esc(L({hi:"नाम",en:"Name"}))+': <b>'+esc(prof.name||"____________")+'</b><br>'+
        esc(L({hi:"पदनाम",en:"Designation"}))+': '+esc(prof.desig||"____________")+'</div>'+
        '<div class="r">'+esc(L({hi:"लेवल",en:"Level"}))+': '+esc(p.level)+'<br>'+
        esc(L({hi:"कर्मचारी आईडी",en:"Employee ID"}))+': '+esc(prof.empid||"____________")+'</div></div>'+
        '<table><tr><th>'+esc(L({hi:"आय",en:"Earnings"}))+'</th><th class="r">₹</th><th>'+esc(L({hi:"कटौती",en:"Deductions"}))+'</th><th class="r">₹</th></tr>'+
        '<tr><td>'+esc(L({hi:"मूल वेतन",en:"Basic pay"}))+'</td><td class="r">'+p.basic.toLocaleString("en-IN")+'</td><td>'+esc(L({hi:"राज्य बीमा",en:"State Insurance"}))+'</td><td class="r">'+p.si.toLocaleString("en-IN")+'</td></tr>'+
        '<tr><td>'+esc(L({hi:"महंगाई भत्ता",en:"DA"}))+' ('+p.daR+'%)</td><td class="r">'+p.da.toLocaleString("en-IN")+'</td><td>RGHS</td><td class="r">'+p.rghs.toLocaleString("en-IN")+'</td></tr>'+
        '<tr><td>'+esc(L({hi:"मकान किराया भत्ता",en:"HRA"}))+' ('+p.hraR+'%)</td><td class="r">'+p.hra.toLocaleString("en-IN")+'</td><td>'+(p.isNps?"NPS":"GPF")+'</td><td class="r">'+p.pen.toLocaleString("en-IN")+'</td></tr>'+
        '<tr><td></td><td></td><td>'+esc(L({hi:"आयकर",en:"Income tax"}))+'</td><td class="r">'+p.tds.toLocaleString("en-IN")+'</td></tr>'+
        '<tr><th>'+esc(L({hi:"सकल वेतन",en:"Gross"}))+'</th><th class="r">'+p.gross.toLocaleString("en-IN")+'</th><th>'+esc(L({hi:"कुल कटौती",en:"Total deductions"}))+'</th><th class="r">'+p.ded.toLocaleString("en-IN")+'</th></tr>'+
        '<tr><th colspan="3">'+esc(L({hi:"शुद्ध देय वेतन",en:"Net in-hand salary"}))+'</th><th class="r">'+p.net.toLocaleString("en-IN")+'</th></tr></table>'+
        '<p class="sm">'+esc(L({hi:"यह TeacherBuddy द्वारा बनाया गया अनुमानित विवरण है, आधिकारिक वेतन पर्ची नहीं। वास्तविक वेतन पर्ची PayManager से प्राप्त करें।",en:"This is an indicative statement generated by TeacherBuddy, not an official pay slip. Obtain the actual pay slip from PayManager."}))+'</p></div>');
    });

    /* DA arrear */
    const arr = ()=>{
      const b=+g("aBasic").value||0, o=parseFloat(g("aOld").value)||0, n=parseFloat(g("aNew").value)||0;
      const m=+g("aMonths").value||0, sp=+g("aSplit").value;
      const diff=Math.max(0,n-o), mo=Math.round(b*diff/100), total=mo*m;
      const gpf=Math.round(total*sp/100), cash=total-gpf;
      g("aOut").innerHTML='<div class="result-box mt"><div class="lbl">'+esc(L({hi:"कुल एरियर",en:"Total arrear"}))+'</div>'+
        '<div class="big">'+rupee(total)+'</div><div class="mt">'+kv([
          [L({hi:"DA अंतर",en:"DA difference"}), diff.toFixed(1)+" %"],
          [L({hi:"मासिक अंतर",en:"Monthly difference"}), rupee(mo)],
          [L({hi:"GPF में जमा",en:"Credited to GPF"}), rupee(gpf)],
          [L({hi:"नकद भुगतान",en:"Paid in cash"}), rupee(cash)]
        ])+'</div></div>';
    };
    ["aBasic","aOld","aNew","aMonths","aSplit"].forEach(id=>{ g(id).addEventListener("input",arr); g(id).addEventListener("change",arr); });
    arr();

    /* surrender */
    const sur = ()=>{
      const b=+g("uBasic").value||0, d=parseFloat(g("uDa").value)||0, days=+g("uDays").value||0;
      const per=(b + b*d/100)/30, tot=per*days;
      g("uOut").innerHTML='<div class="result-box mt"><div class="lbl">'+esc(L({hi:"समर्पण राशि",en:"Surrender amount"}))+'</div>'+
        '<div class="big">'+rupee(tot)+'</div><div class="mt">'+kv([
          [L({hi:"प्रति दिवस दर",en:"Rate per day"}), rupee(per)],
          [L({hi:"दिवस",en:"Days"}), days]
        ])+'</div></div>';
    };
    ["uBasic","uDa","uDays"].forEach(id=>g(id).addEventListener("input",sur));
    sur();

    /* income tax */
    const tax = ()=>{
      const t=(D().rates||{}).tax||{}; if(!t.newRegime) return;
      const gross=+g("tGross").value||0;
      const c80=Math.min(150000,+g("t80c").value||0), d80=+g("t80d").value||0;
      const ccd=+g("t80ccd").value||0, home=+g("tHome").value||0, hra=+g("tHra").value||0;
      const oldTaxable=Math.max(0, gross - t.oldRegime.stdDeduction - c80 - d80 - ccd - home - hra);
      const newTaxable=Math.max(0, gross - t.newRegime.stdDeduction);
      let oldT=taxOn(oldTaxable, t.oldRegime);
      if(oldTaxable<=t.oldRegime.rebateLimit) oldT=Math.max(0, oldT-t.oldRegime.rebateMax);
      let newT=taxOn(newTaxable, t.newRegime);
      if(newTaxable<=t.newRegime.rebateLimit) newT=Math.max(0, newT-t.newRegime.rebateMax);
      const oldTot=Math.round(oldT*(1+(t.cess||4)/100)), newTot=Math.round(newT*(1+(t.cess||4)/100));
      const better = newTot<oldTot ? L({hi:"नई कर व्यवस्था",en:"New regime"}) : (oldTot<newTot ? L({hi:"पुरानी कर व्यवस्था",en:"Old regime"}) : L({hi:"दोनों समान",en:"Both equal"}));
      const save = Math.abs(oldTot-newTot);
      g("tOut").innerHTML='<div class="result-box"><div class="lbl">'+esc(L({hi:"आपके लिए बेहतर",en:"Better for you"}))+'</div>'+
        '<div class="big">'+esc(better)+'</div>'+
        (save>0?'<div class="sm mt">'+esc(L({hi:"वार्षिक बचत",en:"Annual saving"}))+': <b>'+rupee(save)+'</b></div>':'')+
        '<div class="mt">'+kv([
          [L({hi:"पुरानी — कर योग्य आय",en:"Old — taxable income"}), rupee(oldTaxable)],
          [L({hi:"पुरानी — कुल कर (उपकर सहित)",en:"Old — total tax (with cess)"}), "<b>"+rupee(oldTot)+"</b>"],
          [L({hi:"नई — कर योग्य आय",en:"New — taxable income"}), rupee(newTaxable)],
          [L({hi:"नई — कुल कर (उपकर सहित)",en:"New — total tax (with cess)"}), "<b>"+rupee(newTot)+"</b>"],
          [L({hi:"मानक कटौती (पुरानी / नई)",en:"Standard deduction (old / new)"}), rupee(t.oldRegime.stdDeduction)+" / "+rupee(t.newRegime.stdDeduction)]
        ])+'</div></div>';
    };
    ["tGross","t80c","t80d","t80ccd","tHome","tHra"].forEach(id=>g(id).addEventListener("input",tax));
    tax();
  },
  lessons(){
    const ls = D().lessons||{}, as = D().assembly||{};

      if(prof.school && !g("lpSchool").value) g("lpSchool").value=prof.school;
      if(prof.name && !g("lpTeacher").value) g("lpTeacher").value=prof.name;
      const gather=()=>{
        const o={school:g("lpSchool").value,teacher:g("lpTeacher").value,cls:g("lpClass").value,sub:g("lpSub").value,
          topic:g("lpTopic").value,date:g("lpDate").value,dur:g("lpDur").value,lo:g("lpLo").value,aids:g("lpAids").value,hw:g("lpHw").value,p:[]};

      };
      g("lpPrint").addEventListener("click",()=>{
        const o=gather();
        A.printHTML(L({hi:"पाठ योजना",en:"Lesson plan"}),
          '<div class="b"><div class="c"><h2>'+esc(o.school||"____________")+'</h2><h3>'+esc(L({hi:"दैनिक पाठ योजना (5E मॉडल)",en:"Daily Lesson Plan (5E model)"}))+'</h3></div><hr>'+

          '<p><b>'+esc(L({hi:"गृहकार्य",en:"Homework"}))+':</b> '+esc(o.hw)+'</p>'+
          '<div class="sig"><div>'+esc(L({hi:"शिक्षक के हस्ताक्षर",en:"Teacher’s signature"}))+'</div><div>'+esc(L({hi:"संस्था प्रधान का अभिमत एवं हस्ताक्षर",en:"Head of Institution — remark & signature"}))+'</div></div></div>');

        (s.steps||[]).map((st,i)=>'<tr><td><b>'+esc(L((ls.phases||[])[i]?(ls.phases||[])[i].n:{hi:"चरण",en:"Step"}))+'</b></td><td>'+esc(L(st))+'</td></tr>').join("")+'</table>'+
        '<div class="sig"><div>'+esc(L({hi:"शिक्षक के हस्ताक्षर",en:"Teacher’s signature"}))+'</div><div>'+esc(L({hi:"संस्था प्रधान",en:"Head of Institution"}))+'</div></div></div>');
    }));
    /* assembly shuffles */
    let ti=0, gi=0;
    g("asNext") && g("asNext").addEventListener("click",()=>{
      const arr=as.thoughts||[]; if(!arr.length) return;
      ti=(ti+1)%arr.length;

      card.querySelector("p").textContent=L(arr[ti]);

    g("asNextGk") && g("asNextGk").addEventListener("click",()=>{
      const arr=as.gk||[]; if(!arr.length) return;

      const card=g("asNextGk").closest(".card");

      ps[1].textContent=L({hi:"उत्तर",en:"Answer"})+": "+L(arr[gi].a);
    });
    g("asPrint") && g("asPrint").addEventListener("click",()=>{
      const arr=as.thoughts||[], q=(as.gk||[])[gi]||{};
      A.printHTML(L({hi:"प्रार्थना सभा",en:"Morning assembly"}),
        '<div class="b"><div class="c"><h2>'+esc(L({hi:"प्रार्थना सभा पत्रक",en:"Morning Assembly Sheet"}))+'</h2>'+

        '<h3>'+esc(L({hi:"क्रम",en:"Order"}))+'</h3><ol>'+(as.order||[]).map(o=>'<li>'+esc(L(o))+'</li>').join("")+'</ol>'+

    });

  orders(){

      g("ordList").innerHTML=ordRows(list);
    });

window.PAGES = Object.assign(window.PAGES||{}, {shivira, letters, salary, lessons, orders});
window.PAGE_HOOKS = Object.assign(window.PAGE_HOOKS||{}, HOOKS);
})();
</script>

  let y=b.getFullYear()-a.getFullYear(), m=b.getMonth()-a.getMonth(), d=b.getDate()-a.getDate();

/* ─────────── tool behaviour ─────────── */
function wireTools(){
  const g = id=>document.getElementById(id);
  const HI="०१२३४५६७८९";

  /* deep link: #/tools/<id> opens and scrolls to that tool */
  const want=(location.hash||"").split("/")[2];
  if(want){
    const d=g("tool-"+want);
    if(d){ d.open=true; setTimeout(()=>d.scrollIntoView({block:"start",behavior:"smooth"}),60); }
  }

  /* age */
  if(g("tAgeDob")){
    const dob=g("tAgeDob"), on_=g("tAgeOn"), o=g("tAgeOut");
    if(!on_.value){ const t=new Date(); on_.value=t.toISOString().slice(0,10); }
    const run=()=>{
      if(!dob.value){ o.innerHTML=""; return; }
      const a=new Date(dob.value+"T00:00:00"), b=new Date((on_.value||new Date().toISOString().slice(0,10))+"T00:00:00");
      if(b<a){ o.innerHTML='<div class="note red mt">'+esc(L({hi:"तिथि जन्म-तिथि से पहले नहीं हो सकती।",en:"Date cannot be before the date of birth."}))+'</div>'; return; }
      const d=diffYMD(a,b);
      const ages=(D().admission||{}).ages||[];
      const hit=ages.filter(x=>{ const f=new Date(x.from+"T00:00:00"), t=new Date(x.to+"T00:00:00"); return a>=f&&a<=t; });
      o.innerHTML = out(L({hi:"आयु",en:"Age"}), esc(ymdText(d)), [
        [L({hi:"कुल दिन",en:"Total days"}), d.days.toLocaleString("en-IN")],
        [L({hi:"कुल सप्ताह",en:"Total weeks"}), Math.floor(d.days/7).toLocaleString("en-IN")],
        [L({hi:"पात्र कक्षा",en:"Eligible class"}), hit.length? hit.map(h=>L({hi:"कक्षा ",en:"Class "})+h.cls).join(", ") : "—"]
      ]);
    };
    [dob,on_].forEach(x=>x.addEventListener("input",run)); run();
  }

  /* retire */
  if(g("tRetDob")){
    const dob=g("tRetDob"), age=g("tRetAge"), o=g("tRetOut");
    const run=()=>{
      if(!dob.value){ o.innerHTML=""; return; }
      const a=new Date(dob.value+"T00:00:00"); const yrs=+age.value;
      const ret=new Date(a.getFullYear()+yrs, a.getMonth()+1, 0); // last day of birth month
      const today=new Date(); today.setHours(0,0,0,0);
      const left = ret>today ? diffYMD(today,ret) : null;
      const pad=n=>String(n).padStart(2,"0");
      o.innerHTML = out(L({hi:"सेवानिवृत्ति तिथि",en:"Date of retirement"}),
        esc(pad(ret.getDate())+"."+pad(ret.getMonth()+1)+"."+ret.getFullYear()),
        [[L({hi:"शेष सेवा",en:"Remaining service"}), left?esc(ymdText(left)):esc(L({hi:"सेवानिवृत्त",en:"Retired"}))],
         [L({hi:"नियम",en:"Rule"}), esc(L({hi:"जिस माह में जन्म हुआ, उसी माह के अंतिम दिन",en:"Last day of the birth month"}))]]);
    };
    [dob,age].forEach(x=>x.addEventListener("input",run)); run();
  }

  /* duration */
  if(g("tDurA")){
    const a=g("tDurA"), b=g("tDurB"), o=g("tDurOut");
    const run=()=>{
      if(!a.value||!b.value){ o.innerHTML=""; return; }
      let x=new Date(a.value+"T00:00:00"), y=new Date(b.value+"T00:00:00");
      if(y<x){ const t=x; x=y; y=t; }
      const d=diffYMD(x,y);
      o.innerHTML = out(L({hi:"अवधि",en:"Duration"}), esc(ymdText(d)),
        [[L({hi:"कुल दिन",en:"Total days"}), d.days.toLocaleString("en-IN")],
         [L({hi:"कुल माह (लगभग)",en:"Total months (approx.)"}), (d.y*12+d.m)]]);
    };
    [a,b].forEach(x=>x.addEventListener("input",run));
  }

  /* grade */
  function gradeOf(pc){
    const sc=(D().cce||{}).gradeScale||[];
    for(const s of sc){
      const p=String(s.r).split(/[–-]/).map(x=>parseFloat(x));
      if(p.length===2 && pc>=p[0] && pc<=p[1]) return s;
    }
    return null;
  }
  if(g("tGrM")){
    const m=g("tGrM"), t=g("tGrT"), o=g("tGrOut");
    const run=()=>{
      const mv=parseFloat(m.value), tv=parseFloat(t.value);
      if(isNaN(mv)||isNaN(tv)||tv<=0){ o.innerHTML=""; return; }
      const pc=Math.round(mv/tv*10000)/100; const gr=gradeOf(pc);
      o.innerHTML = out(L({hi:"ग्रेड",en:"Grade"}), (gr?esc(gr.g):"—"),
        [[L({hi:"प्रतिशत",en:"Percentage"}), pc.toFixed(2)+" %"],
         [L({hi:"अर्थ",en:"Meaning"}), gr?esc(L(gr.d)):"—"]]);
    };
    [m,t].forEach(x=>x.addEventListener("input",run));
  }

  /* bulk grade */
  if(g("tBgGo")){
    let rows=[];
    const run=()=>{
      const tot=parseFloat(g("tBgTotal").value)||100;
      rows = g("tBgIn").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
        const m=l.match(/^(.*?)[,\t;]?\s*(-?\d+(?:\.\d+)?)\s*$/);
        if(!m) return {n:l, m:null};
        const marks=parseFloat(m[2]); const pc=Math.round(marks/tot*10000)/100;
        const gr=gradeOf(pc);
        return {n:m[1].replace(/[,;\t]+$/,"").trim()||"—", m:marks, pc:pc, g:gr?gr.g:"—", d:gr?L(gr.d):"—"};
      });
      const valid=rows.filter(r=>r.m!==null);
      const avg = valid.length ? valid.reduce((s,r)=>s+r.pc,0)/valid.length : 0;
      g("tBgOut").innerHTML = rows.length
        ? '<div class="tw mt"><table><thead><tr><th class="num">#</th><th>'+esc(L({hi:"नाम",en:"Name"}))+'</th><th class="num">'+esc(L({hi:"अंक",en:"Marks"}))+'</th><th class="num">%</th><th>'+esc(L({hi:"ग्रेड",en:"Grade"}))+'</th><th>'+esc(L({hi:"अर्थ",en:"Meaning"}))+'</th></tr></thead><tbody>'+
          rows.map((r,i)=>'<tr><td class="num">'+(i+1)+'</td><td>'+esc(r.n)+'</td><td class="num">'+(r.m===null?"—":r.m)+'</td><td class="num">'+(r.m===null?"—":r.pc.toFixed(1))+'</td><td><b>'+esc(r.g||"—")+'</b></td><td>'+esc(r.d||"—")+'</td></tr>').join("")+
          '</tbody></table></div>'+
          '<div class="result-box mt"><div class="kv"><span>'+esc(L({hi:"कुल विद्यार्थी",en:"Total students"}))+'</span><b>'+valid.length+'</b></div>'+
          '<div class="kv"><span>'+esc(L({hi:"औसत प्रतिशत",en:"Average percentage"}))+'</span><b>'+avg.toFixed(2)+' %</b></div></div>'
        : '<div class="empty">'+esc(L({hi:"ऊपर नाम एवं अंक लिखें",en:"Enter names and marks above"}))+'</div>';
    };
    g("tBgGo").addEventListener("click",run);
    g("tBgCsv").addEventListener("click",()=>{
      if(!rows.length) run();
      const csv="Name,Marks,Percent,Grade\n"+rows.map(r=>'"'+String(r.n).replace(/"/g,'""')+'",'+(r.m===null?"":r.m)+","+(r.m===null?"":r.pc.toFixed(2))+","+(r.g||"")).join("\n");
      download("grade-sheet.csv","﻿"+csv,"text/csv;charset=utf-8");
    });
    g("tBgPrint").addEventListener("click",()=>{
      if(!rows.length) run();
      printHTML("Grade Sheet","<h2>"+esc(L({hi:"ग्रेड सारणी",en:"Grade Sheet"}))+"</h2><table><tr><th>#</th><th>"+esc(L({hi:"नाम",en:"Name"}))+"</th><th>"+esc(L({hi:"अंक",en:"Marks"}))+"</th><th>%</th><th>"+esc(L({hi:"ग्रेड",en:"Grade"}))+"</th></tr>"+
        rows.map((r,i)=>"<tr><td>"+(i+1)+"</td><td>"+esc(r.n)+"</td><td>"+(r.m===null?"":r.m)+"</td><td>"+(r.m===null?"":r.pc.toFixed(1))+"</td><td>"+esc(r.g||"")+"</td></tr>").join("")+"</table>");
    });
  }

  /* percent */
  if(g("tPcO")){
    const o1=g("tPcO"), t1=g("tPcT"), r1=g("tPcOut");
    const run1=()=>{
      const a=parseFloat(o1.value), b=parseFloat(t1.value);
      if(isNaN(a)||isNaN(b)||b<=0){ r1.innerHTML=""; return; }
      const pc=a/b*100;
      r1.innerHTML = out(L({hi:"प्रतिशत",en:"Percentage"}), pc.toFixed(2)+" %",
        [[L({hi:"प्राप्तांक",en:"Obtained"}), a+" / "+b],[L({hi:"ग्रेड",en:"Grade"}), (gradeOf(Math.round(pc*100)/100)||{g:"—"}).g]]);
    };
    [o1,t1].forEach(x=>x.addEventListener("input",run1));
    const ap=g("tPcApp"), ps=g("tPcPass"), r2=g("tPcOut2");
    const run2=()=>{
      const a=parseFloat(ap.value), p=parseFloat(ps.value);
      if(isNaN(a)||isNaN(p)||a<=0){ r2.innerHTML=""; return; }
      r2.innerHTML = out(L({hi:"परिणाम प्रतिशत",en:"Pass percentage"}), (p/a*100).toFixed(2)+" %",
        [[L({hi:"उत्तीर्ण",en:"Passed"}), p],[L({hi:"अनुत्तीर्ण",en:"Not passed"}), Math.max(0,a-p)]]);
    };
    [ap,ps].forEach(x=>x.addEventListener("input",run2));
  }

  /* attendance */
  if(g("tAtP")){
    const p=g("tAtP"), t=g("tAtT"), o=g("tAtOut");
    const run=()=>{
      const a=parseFloat(p.value), b=parseFloat(t.value);
      if(isNaN(a)||isNaN(b)||b<=0){ o.innerHTML=""; return; }
      const pc=a/b*100;
      const short=Math.ceil(0.75*b-a);
      o.innerHTML = out(L({hi:"उपस्थिति",en:"Attendance"}), pc.toFixed(2)+" %",
        [[L({hi:"अनुपस्थित दिवस",en:"Days absent"}), Math.max(0,b-a)],
         [L({hi:"75% की स्थिति",en:"Against 75%"}),
          short<=0 ? '<span class="chip ok">'+esc(L({hi:"पूर्ण",en:"Met"}))+'</span>'
                   : '<span class="chip warn">'+short+" "+esc(L({hi:"दिन कम",en:"days short"}))+'</span>']]);
    };
    [p,t].forEach(x=>x.addEventListener("input",run));
  }

  /* remark builder */
  if(g("tRmSub")){
    const subs=[{hi:"हिन्दी",en:"Hindi"},{hi:"अंग्रेज़ी",en:"English"},{hi:"गणित",en:"Mathematics"},{hi:"विज्ञान",en:"Science"},{hi:"सामाजिक विज्ञान",en:"Social Science"},{hi:"पर्यावरण अध्ययन",en:"EVS"},{hi:"संस्कृत",en:"Sanskrit"}];
    const levs=[
      {k:"a", hi:"में उत्कृष्ट कार्य करता है", label:{hi:"उत्कृष्ट (A)",en:"Outstanding (A)"}},
      {k:"b", hi:"में अच्छी प्रगति की है", label:{hi:"अच्छा (B)",en:"Good (B)"}},
      {k:"c", hi:"में कार्य संतोषजनक है", label:{hi:"संतोषजनक (C)",en:"Satisfactory (C)"}},
      {k:"d", hi:"के प्रति रुझान कम है, अभ्यास की आवश्यकता है", label:{hi:"सुधार अपेक्षित (D)",en:"Needs improvement (D)"}},
      {k:"e", hi:"में शिक्षक की सहायता की आवश्यकता पड़ती है", label:{hi:"विशेष सहयोग (E)",en:"Needs support (E)"}}
    ];
    const extras=[
      {hi:"", label:{hi:"— कोई नहीं —",en:"— none —"}},
      {hi:"कक्षा में सहभागिता अच्छी है।", label:{hi:"सहभागिता",en:"Participation"}},
      {hi:"गृहकार्य एवं कक्षाकार्य समय पर पूरा करता है।", label:{hi:"गृहकार्य",en:"Homework"}},
      {hi:"सहशैक्षिक गतिविधियों में रुचि रखता है।", label:{hi:"सहशैक्षिक",en:"Co-curricular"}},
      {hi:"साथियों के साथ अच्छा तालमेल रखता है।", label:{hi:"सामाजिकता",en:"Peer relations"}},
      {hi:"खेलों और सांस्कृतिक कार्यों में रुचि से भाग लेता है।", label:{hi:"खेल एवं संस्कृति",en:"Sports & culture"}},
      {hi:"स्वच्छता एवं अनुशासन का ध्यान रखता है।", label:{hi:"स्वच्छता एवं अनुशासन",en:"Hygiene & discipline"}}
    ];
    g("tRmSub").innerHTML = subs.map((s,i)=>'<option value="'+i+'">'+esc(L(s))+'</option>').join("");
    g("tRmLev").innerHTML = levs.map((s,i)=>'<option value="'+i+'">'+esc(L(s.label))+'</option>').join("");

      Object.keys(sets).forEach(k=>{ if(g(k).checked){ pool+=sets[k]; must.push(sets[k]); } });
      if(!pool){ toast(L({hi:"कम से कम एक विकल्प चुनें",en:"Select at least one option"})); return; }
      const n=Math.max(6,Math.min(64,+g("tPwLen").value||14));
      const rnd=len=>{ const a=new Uint32Array(len); (crypto&&crypto.getRandomValues)?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*4294967296); return a; };
      const r=rnd(n); let pw=[];
      must.forEach((s,i)=>{ if(i<n) pw.push(s[r[i]%s.length]); });
      for(let i=pw.length;i<n;i++) pw.push(pool[r[i]%pool.length]);
      const rs=rnd(n);
      for(let i=n-1;i>0;i--){ const j=rs[i]%(i+1); const t=pw[i]; pw[i]=pw[j]; pw[j]=t; }
      const s=pw.join("");
      const strength = n>=16?L({hi:"बहुत मज़बूत",en:"Very strong"}) : n>=12?L({hi:"मज़बूत",en:"Strong"}) : L({hi:"सामान्य",en:"Moderate"});

function countOf(v){
  if(Array.isArray(v)) return v.length;
  if(v && typeof v==="object") return Object.keys(v).length;
  return 1;
}

function wireUpdate(){
  const g=id=>document.getElementById(id);
  if(!g("upKey")) return;
  const keySel=g("upKey"), ta=g("upJson"), msg=g("upMsg");
  const load=()=>{ ta.value = JSON.stringify(D()[keySel.value], null, 2); msg.innerHTML=""; };
  keySel.addEventListener("change",load); load();

  const say=(kind,text)=>{ msg.innerHTML='<div class="note '+kind+'">'+esc(text)+'</div>'; };

  g("upFormat").addEventListener("click",()=>{
    try{ ta.value=JSON.stringify(JSON.parse(ta.value),null,2); say("", L({hi:"JSON सही है।",en:"JSON is valid."})); }
    catch(e){ say("red", L({hi:"त्रुटि: ",en:"Error: "})+e.message); }
  });
  g("upCopy").addEventListener("click",()=>copyText(ta.value));
  g("upSave").addEventListener("click",()=>{
    let parsed;
    try{ parsed=JSON.parse(ta.value); }
    catch(e){ say("red", L({hi:"सहेजा नहीं गया — JSON में त्रुटि: ",en:"Not saved — JSON error: "})+e.message); return; }
    const ov=A.LS.get("override",{})||{};
    ov[keySel.value]=parsed;
    if(!A.LS.set("override",ov)){ say("red", L({hi:"ब्राउज़र में जगह नहीं बची।",en:"No space left in the browser."})); return; }
    A.D = Object.assign({}, A.D, ov);
    A.buildIndex(); A.refreshFooter();
    say("", L({hi:"सहेज लिया गया। बदलाव तुरंत लागू है।",en:"Saved. The change is applied immediately."}));
    toast(L({hi:"सहेजा गया",en:"Saved"}));
  });
  g("upReset").addEventListener("click",()=>{
    const ov=A.LS.get("override",{})||{};
    delete ov[keySel.value];
    A.LS.set("override",ov);
    A.D = Object.assign({}, TB_DATA, ov);
    load(); A.buildIndex();
    toast(L({hi:"मूल पर लौटा दिया गया",en:"Reset to original"}));
    location.hash="#/update";
  });
  g("upExport").addEventListener("click",()=>{
    const all={}; EDITABLE.forEach(([k])=>all[k]=D()[k]);
    download("teacherbuddy-data-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(all,null,2), "application/json");
  });
  g("upImport").addEventListener("change",e=>{
    const f=e.target.files && e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const obj=JSON.parse(rd.result);
        if(!obj||typeof obj!=="object") throw new Error("not an object");
        A.LS.set("override",obj);
        A.D=Object.assign({},TB_DATA,obj);
        A.buildIndex();
        toast(L({hi:"आयात पूर्ण",en:"Imported"}));
        location.hash="#/home"; setTimeout(()=>location.hash="#/update",30);
      }catch(err){ say("red", L({hi:"आयात विफल: ",en:"Import failed: "})+err.message); }
    };
    rd.readAsText(f);
  });
  g("upResetAll").addEventListener("click",()=>{
    A.LS.del("override");
    A.D=TB_DATA; A.buildIndex();
    toast(L({hi:"सभी स्थानीय बदलाव मिटा दिए गए",en:"All local changes cleared"}));
    location.hash="#/home"; setTimeout(()=>location.hash="#/update",30);
  });
}

window.PAGE_HOOKS = Object.assign(window.PAGE_HOOKS||{}, {tools:wireTools, update:wireUpdate});
